name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Budowanie APK
        run: gradle assembleDebug --no-daemon

      - name: Nazwa pliku
        run: cp build/outputs/apk/debug/*.apk ZegarekTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZegarekTest-apk
          path: ZegarekTest.apk

      - name: Wydanie do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Zegarek Test – najnowsza wersja
          prerelease: false
          make_latest: true
          files: ZegarekTest.apk
