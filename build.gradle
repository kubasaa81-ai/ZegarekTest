plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'pl.kuba.zegarektest'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.kuba.zegarektest'
        minSdk 28
        targetSdk 34
        versionCode 17
        versionName '2.0'
    }

    signingConfigs {
        stale {
            storeFile file('zegarek.keystore')
            storePassword 'zegarek123'
            keyAlias 'zegarek'
            keyPassword 'zegarek123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stale
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
