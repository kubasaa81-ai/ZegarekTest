plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
}

android {
    namespace 'pl.kuba.zegarektest'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.kuba.zegarektest'
        minSdk 28
        targetSdk 34
        versionCode 28
        versionName '3.1'
    }

    signingConfigs {
        stale {
            storeFile file('zegarek.keystore')
            storePassword 'zegarek123'
            keyAlias 'zegarek'
            keyPassword 'zegarek123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stale
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Oficjalna biblioteka HBand/Veepoo (Apache 2.0) – sen, godzina, tarcze
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'no.nordicsemi.android:mcumgr-core:2.7.4'
    implementation 'no.nordicsemi.android:mcumgr-ble:2.7.4'
    implementation 'no.nordicsemi.android.support.v18:scanner:1.4.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
