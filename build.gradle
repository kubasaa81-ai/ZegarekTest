plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'pl.kuba.zegarektest'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.kuba.zegarektest'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.5'
    }

    signingConfigs {
        stale {
            storeFile file('zegarek.keystore')
            storePassword 'zegarek123'
            keyAlias 'zegarek'
            keyPassword 'zegarek123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stale
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
